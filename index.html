<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رشتو | بریدن توییت‌های طولانی برای رشته توییت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2340;
    --ink-soft:#5b6485;
    --line:rgba(255,255,255,.75);
    --glass:rgba(255,255,255,.52);
    --glass-strong:rgba(255,255,255,.72);
    --teal:#14b8a6; --indigo:#6366f1; --violet:#a855f7;
    --spectrum:linear-gradient(115deg,#14b8a6 0%,#6366f1 55%,#a855f7 100%);
    --danger:#be123c;
    --shadow:0 20px 50px -22px rgba(76,60,160,.35), 0 2px 0 rgba(255,255,255,.6) inset;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; color:var(--ink);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 18px 24px;
  }

  /* ---------- Aurora background ---------- */
  .aurora{ position:fixed; inset:0; z-index:-1; overflow:hidden;
    background:linear-gradient(140deg,#eaf6f5 0%,#eef0fb 55%,#f3eefb 100%); }
  .aurora i{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.5;
    animation:drift 24s ease-in-out infinite alternate; }
  .aurora i:nth-child(1){ width:48vmax; height:48vmax; background:#2dd4bf; top:-16vmax; right:-12vmax; }
  .aurora i:nth-child(2){ width:42vmax; height:42vmax; background:#818cf8; top:24vh; left:-16vmax; animation-delay:-8s; }
  .aurora i:nth-child(3){ width:40vmax; height:40vmax; background:#c084fc; bottom:-16vmax; right:6vmax; animation-delay:-16s; }
  @keyframes drift{ to{ transform:translate(6vmax,-4vmax) scale(1.12); } }
  @media (prefers-reduced-motion:reduce){ .aurora i{ animation:none; } }

  .wrap{ width:100%; max-width:760px; }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom:8px; }
  .title{
    font-size:46px; font-weight:800; margin:0; line-height:1.4;
    background:var(--spectrum); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .subtitle{ margin:2px 0 0; color:var(--ink-soft); font-size:15px; font-weight:500; }
  .stitch{ display:flex; align-items:center; justify-content:center; gap:10px; margin:16px 0 0; }
  .stitch .dash{ flex:1; max-width:160px; height:0; border-top:2px dashed rgba(99,102,241,.35); }
  .stitch .scissors{ font-size:16px; transform:rotate(90deg); }

  /* ---------- Glass card ---------- */
  .card{
    background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(170%); backdrop-filter:blur(24px) saturate(170%);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:26px; margin-top:22px;
  }

  .tabs{
    display:flex; gap:6px; padding:5px; margin-bottom:22px;
    background:rgba(255,255,255,.45); border:1px solid var(--line); border-radius:14px;
  }
  .tab-btn{
    flex:1; border:none; background:transparent; color:var(--ink-soft);
    font-family:inherit; font-size:14.5px; font-weight:600;
    padding:9px 10px; border-radius:10px; cursor:pointer;
    transition:background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .tab-btn.active{ background:var(--spectrum); color:#fff; box-shadow:0 8px 18px -8px rgba(99,102,241,.7); }

  label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; }

  textarea,input[type=number],select{
    width:100%; font-family:inherit; font-size:15px; color:var(--ink);
    background:var(--glass-strong); border:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 4px 14px -10px rgba(76,60,160,.4);
    border-radius:14px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{ min-height:160px; resize:vertical; line-height:1.9; padding:14px 16px; }
  input[type=number]{ padding:11px 14px; direction:ltr; text-align:right; }
  select{ padding:11px 14px; cursor:pointer; direction:rtl; text-align:right; }
  select option{ direction:rtl; text-align:right; }
  textarea:focus,input[type=number]:focus,select:focus{
    border-color:var(--indigo); box-shadow:0 0 0 3px rgba(99,102,241,.2);
  }

  .counter-row{ display:flex; justify-content:flex-end; margin-top:8px; font-size:13px; color:var(--ink-soft); }
  .counter-row b{ color:var(--indigo); font-weight:700; margin-right:4px; }

  .settings-row{ display:flex; gap:12px; margin-top:22px; }
  .settings-row > div{ flex:1 1 0; min-width:0; }

  .primary-btn{
    margin-top:22px; width:100%; color:#fff; border:none;
    background:var(--spectrum); background-size:160% 100%; background-position:100% 0;
    font-family:inherit; font-size:15.5px; font-weight:700; padding:13px; border-radius:14px; cursor:pointer;
    box-shadow:0 14px 26px -14px rgba(99,102,241,.8);
    transition:background-position .4s ease, transform .1s ease;
  }
  .primary-btn:hover{ background-position:0 0; }
  .primary-btn:active{ transform:scale(.99); }
  .tab-btn:focus-visible,.primary-btn:focus-visible{ outline:3px solid rgba(99,102,241,.45); outline-offset:2px; }

  .error-box{
    margin-top:16px; background:rgba(244,63,94,.12); border:1px solid rgba(244,63,94,.35);
    color:var(--danger); font-size:13.5px; font-weight:600; padding:12px 14px; border-radius:14px;
  }

  /* ---------- Result cards ---------- */
  .results{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .seg-card{
    position:relative; cursor:pointer;
    background:var(--glass-strong); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px 26px; font-size:14.5px; line-height:1.9;
    box-shadow:0 8px 20px -16px rgba(76,60,160,.5);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .seg-card:hover{ border-color:var(--indigo); box-shadow:0 10px 24px -12px rgba(99,102,241,.45); }
  .seg-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .seg-num{
    font-size:12px; font-weight:700; color:#fff; background:var(--spectrum);
    padding:2px 12px; border-radius:20px;
  }
  .seg-len{ font-size:11.5px; color:var(--ink-soft); }
  .seg-card.too-long{ border-color:rgba(244,63,94,.55); }
  .seg-card.too-long .seg-len{ color:var(--danger); font-weight:700; }
  .seg-text{ white-space:pre-wrap; word-break:break-word; }
  .copy-hint{ position:absolute; left:14px; bottom:8px; font-size:11px; color:var(--indigo); opacity:.55; transition:opacity .15s ease; }
  .seg-card:hover .copy-hint{ opacity:1; }
  .seg-card.copied{ border-color:var(--teal); background:rgba(45,212,191,.2); }

  /* ---------- Manual mode ---------- */
  .manual-hint{
    font-size:13px; color:var(--ink-soft); margin-bottom:14px; padding:10px 14px;
    background:rgba(99,102,241,.08); border:1px dashed rgba(99,102,241,.45); border-radius:14px;
  }
  .manual-box{
    background:var(--glass-strong); border:1px solid var(--line); border-radius:16px;
    padding:20px 16px; font-size:15px; line-height:2.5; word-break:break-word;
  }
  .manual-box .placeholder{ color:var(--ink-soft); font-size:14px; }

  /* All inline pieces share the same font and have NO vertical padding, so every
     highlight is exactly one content-area tall. */
  .word{ padding:0; background:none; }
  .gap{
    display:inline; white-space:pre-wrap; cursor:pointer; position:relative;
    padding:0 2px; margin:0 -2px; background:none; border-radius:0;
  }
  .gap:hover{ background:rgba(99,102,241,.2); }
  .gap:hover::after{ content:"✂"; position:absolute; top:-1.15em; right:0; font-size:11px; color:var(--indigo); line-height:1; }
  .gap.cut{ background:rgba(99,102,241,.16); box-shadow:inset 0 -2px 0 var(--indigo); }
  .gap.cut::before{ content:"✂"; position:absolute; top:-1.15em; right:0; font-size:11px; color:var(--indigo); line-height:1; }
  .gap.cut:hover::after{ content:none; }

  /* One wrapper element holds the entire out-of-limit part of a segment,
     so the highlight is a single continuous band. */
  .over-zone{
    background:rgba(244,63,94,.22);
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
    border-radius:0;
  }

  /* ---------- Footer ---------- */
  footer{ margin-top:34px; text-align:center; font-size:13px; color:var(--ink-soft); padding-bottom:10px; }
  footer a{ color:var(--indigo); font-weight:700; text-decoration:none; border-bottom:1px dashed var(--violet); }
  footer a:hover{ color:var(--violet); }
  .version{ margin-top:4px; font-size:12px; color:#8a92ae; }

  @media (max-width:480px){
    .title{ font-size:36px; }
    .card{ padding:18px; border-radius:20px; }
    .settings-row{ gap:8px; }
    input[type=number],select{ padding:11px 8px; font-size:13.5px; }
  }
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>

<div class="wrap">
  <header>
    <h1 class="title">رشتو</h1>
    <p class="subtitle">بریدن توییت‌های طولانی برای رشته توییت</p>
    <div class="stitch"><span class="dash"></span><span class="scissors">✂️</span><span class="dash"></span></div>
  </header>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabAutoBtn" onclick="switchTab('auto')">خودکار</button>
      <button class="tab-btn" id="tabManualBtn" onclick="switchTab('manual')">دستی</button>
    </div>

    <label for="mainText">متن خود را وارد کنید</label>
    <textarea id="mainText" placeholder="متن طولانی خود را اینجا بنویسید یا بچسبانید..."></textarea>
    <div class="counter-row">تعداد کاراکتر: <b id="charCount">۰</b></div>

    <div class="settings-row">
      <div>
        <label for="limitInput">محدودیت کاراکتر</label>
        <input type="number" id="limitInput" value="280" min="1" inputmode="numeric">
      </div>
      <div>
        <label for="endingSelect">افزوده‌ها</label>
        <select id="endingSelect">
          <option value="none">بدون افزوده</option>
          <option value="slash_b_prefix">۱/ آغازی</option>
          <option value="slash">/۱ پایانی</option>
          <option value="paren_prefix">(۲/۱) آغازی</option>
          <option value="paren">(۲/۱) پایانی</option>
          <option value="arrow_down">↓ پایانی</option>
          <option value="emoji1">👇 پایانی</option>
          <option value="emoji2">⬇️ پایانی</option>
        </select>
      </div>
    </div>

    <div id="autoSection">
      <button class="primary-btn" onclick="runAutoSplit()">تقسیم متن</button>
      <div id="autoError"></div>
      <div class="results" id="autoResults"></div>
    </div>

    <div id="manualSection" style="display:none;">
      <div class="manual-hint">
        روی فاصله‌ی بین کلمات کلیک کنید تا آن نقطه به عنوان محل برش انتخاب شود. بخشِ قرمزرنگ، قسمتی از متن است که (با احتساب پایان‌بندی) از محدودیت کاراکتر عبور کرده است.
      </div>
      <div class="manual-box" id="manualBox"></div>
      <div id="manualError"></div>
      <div class="results" id="manualResults"></div>
    </div>
  </div>

  <footer>
    طراحی شده توسط: <a href="https://x.com/pushideh" target="_blank" rel="noopener">پوشیده</a>
    <div class="version">نسخه‌ی برنامه: ۲.۰</div>
  </footer>
</div>

<script>
/* ---------------- Core helpers ---------------- */
function toPersianDigits(input) {
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(input).replace(/[0-9]/g, d => map[d]);
}
function countChars(str){ return Array.from(str).length; }

// Splits a string into grapheme clusters, so a base letter and its combining marks
// (kasra «ِ», fatha, shadda, ZWNJ, variation selectors...) are never separated.
const graphemeSegmenter = (typeof Intl !== 'undefined' && Intl.Segmenter)
  ? new Intl.Segmenter('fa', { granularity: 'grapheme' }) : null;
function splitGraphemes(str){
  if (graphemeSegmenter) return Array.from(graphemeSegmenter.segment(str), s => s.segment);
  const out = [];
  for (const ch of Array.from(str)) {
    if (out.length && /[\p{M}\u200C\u200D\uFE0E\uFE0F]/u.test(ch)) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out;
}

const ENDING_CONFIG = {
  none:            { build: (a,b) => '', pos: (a,b) => 'suffix' },
  paren:           { build: (a,b) => '(' + toPersianDigits(a) + '/' + toPersianDigits(b) + ')', pos: (a,b) => 'suffix' },
  slash:           { build: (a,b) => '/' + toPersianDigits(b), pos: (a,b) => 'suffix' },
  emoji1:          {
    build: (a,b) => { if (b < a) return '👇'; if (a === 2) return '👆'; return ''; },
    pos:   (a,b) => (b === a && a === 2) ? 'prefix' : 'suffix',
  },
  emoji2:          {
    build: (a,b) => { if (b < a) return '⬇️'; if (a === 2) return '⬆️'; return ''; },
    pos:   (a,b) => (b === a && a === 2) ? 'prefix' : 'suffix',
  },
  arrow_down:      {
    build: (a,b) => { if (b < a) return '↓'; if (a === 2) return '↑'; return ''; },
    pos:   (a,b) => (b === a && a === 2) ? 'prefix' : 'suffix',
  },
  paren_prefix:    { build: (a,b) => '(' + toPersianDigits(a) + '/' + toPersianDigits(b) + ')', pos: (a,b) => 'prefix' },
  slash_b_prefix:  { build: (a,b) => toPersianDigits(b) + '/', pos: (a,b) => 'prefix' },
};

function buildEnding(type, a, b) {
  const cfg = ENDING_CONFIG[type];
  return cfg ? cfg.build(a, b) : '';
}
function getEndingPosition(type, a, b){
  const cfg = ENDING_CONFIG[type];
  return cfg ? cfg.pos(a, b) : 'suffix';
}
function getEndingLength(type, a, b){ return countChars(buildEnding(type,a,b)); }
// Budget reserved from the limit: the ending itself PLUS the joining space.
function getEndingBudget(type, a, b){
  const len = getEndingLength(type, a, b);
  return len > 0 ? len + 1 : 0;
}
// Used while auto-splitting hasn't finalized the real segment numbers yet (worst case).
function getConvergenceBudget(type, guessTotal){
  if (type === 'emoji1' || type === 'emoji2' || type === 'arrow_down') {
    const refB = guessTotal > 1 ? 1 : guessTotal;
    return getEndingBudget(type, guessTotal, refB);
  }
  return getEndingBudget(type, guessTotal, guessTotal);
}
// Manual mode: closed segments have a known ending; the trailing open segment is previewed
// conservatively, as if it will end up needing an ending.
function getPreviewEndingBudget(type, totalSegs, segNumber, isTrailingOpen){
  if (!isTrailingOpen) return getEndingBudget(type, totalSegs, segNumber);
  if (type === 'emoji1' || type === 'emoji2' || type === 'arrow_down') {
    return getEndingBudget(type, Math.max(totalSegs, 2), 1);
  }
  if (type === 'none') return 0;
  return getEndingBudget(type, totalSegs + 2, segNumber);
}
function combineSegment(segText, ending, type, a, b){
  if (!ending) return segText;
  return getEndingPosition(type, a, b) === 'prefix' ? (ending + ' ' + segText) : (segText + ' ' + ending);
}

function tokenizeWords(text) {
  // Words plus the exact separator (spaces, tabs, newlines...) after each word.
  const trimmed = text.replace(/^\s+/, '').replace(/\s+$/, '');
  const words = [];
  const seps = [];
  const re = /(\S+)(\s+|$)/g;
  let m;
  while ((m = re.exec(trimmed)) !== null) {
    words.push(m[1]);
    if (m[2]) seps.push(m[2]);
    if (re.lastIndex >= trimmed.length) break;
  }
  return { words, seps };
}

function greedySplit(words, seps, limit) {
  const segments = [];
  let current = '';
  function pushLong(w){
    while (countChars(w) > limit) {
      const gs = splitGraphemes(w);
      let n = 0, k = 0;
      while (k < gs.length) {
        const c = countChars(gs[k]);
        if (n + c > limit) break;
        n += c; k++;
      }
      if (k === 0) k = 1;
      segments.push(gs.slice(0, k).join(''));
      w = gs.slice(k).join('');
    }
    return w;
  }
  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const sep = i > 0 ? seps[i-1] : '';
    const addition = current ? sep + word : word;
    const candidate = current + addition;
    if (countChars(candidate) <= limit) {
      current = candidate;
    } else if (current === '') {
      current = pushLong(word);
    } else {
      segments.push(current);
      current = countChars(word) > limit ? pushLong(word) : word;
    }
  }
  if (current) segments.push(current);
  return segments;
}

function computeSegments(text, limit, endingType) {
  const { words, seps } = tokenizeWords(text);
  if (words.length === 0) return { error: 'ابتدا متنی وارد کنید.', segments: [] };
  let guessTotal = 1;
  let segments = [];
  for (let iter = 0; iter < 10; iter++) {
    const e = getConvergenceBudget(endingType, guessTotal);
    const effLimit = limit - e;
    if (effLimit <= 0) {
      return { error: 'محدودیت کاراکتر برای این نوع پایان‌بندی کافی نیست. عدد بزرگ‌تری وارد کنید.', segments: [] };
    }
    segments = greedySplit(words, seps, effLimit);
    if (segments.length === guessTotal) break;
    guessTotal = segments.length;
  }
  const total = segments.length;
  const finalSegments = segments.map((seg, idx) => {
    const ending = buildEnding(endingType, total, idx + 1);
    const full = combineSegment(seg, ending, endingType, total, idx + 1);
    return { text: seg, ending, full, length: countChars(full) };
  });
  return { error: null, segments: finalSegments, total };
}

/* ---------------- UI wiring ---------------- */
const mainText = document.getElementById('mainText');
const charCount = document.getElementById('charCount');
const limitInput = document.getElementById('limitInput');
const endingSelect = document.getElementById('endingSelect');
const manualCuts = new Set(); // cut positions as character offsets (end of the word before the cut)
let lastText = mainText.value;

function updateCharCount(){
  charCount.textContent = toPersianDigits(countChars(mainText.value));
}
mainText.addEventListener('input', () => {
  remapCuts(lastText, mainText.value);
  lastText = mainText.value;
  updateCharCount();
  if (currentTab === 'manual') renderManual();
});
limitInput.addEventListener('input', () => {
  limitInput.value = limitInput.value.replace(/[^\d]/g, '');
  if (currentTab === 'manual') renderManual();
});
endingSelect.addEventListener('change', () => {
  if (currentTab === 'manual') renderManual();
});
updateCharCount();

let currentTab = 'auto';
function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabAutoBtn').classList.toggle('active', tab==='auto');
  document.getElementById('tabManualBtn').classList.toggle('active', tab==='manual');
  document.getElementById('autoSection').style.display = tab==='auto' ? '' : 'none';
  document.getElementById('manualSection').style.display = tab==='manual' ? '' : 'none';
  if (tab === 'manual') renderManual();
}

function errorHtml(msg){ return '<div class="error-box">' + msg + '</div>'; }

function makeCard(seg, idx, total, limit){
  const card = document.createElement('div');
  card.className = 'seg-card' + (seg.length > limit ? ' too-long' : '');
  card.innerHTML =
    '<div class="seg-head">' +
      '<span class="seg-num">بخش ' + toPersianDigits(idx+1) + ' از ' + toPersianDigits(total) + '</span>' +
      '<span class="seg-len">' + toPersianDigits(seg.length) + ' کاراکتر' + (seg.length > limit ? ' (بیش از حد مجاز)' : '') + '</span>' +
    '</div>' +
    '<div class="seg-text"></div>' +
    '<div class="copy-hint">برای کپی کلیک کنید</div>';
  card.querySelector('.seg-text').textContent = seg.full;
  card.addEventListener('click', () => copyToClipboard(seg.full, card));
  return card;
}

/* ---------------- Auto mode ---------------- */
function runAutoSplit(){
  const text = mainText.value;
  const limit = parseInt(limitInput.value || '0', 10);
  const endingType = endingSelect.value;
  const errBox = document.getElementById('autoError');
  const resultsBox = document.getElementById('autoResults');
  errBox.innerHTML = '';
  resultsBox.innerHTML = '';

  if (!limit || limit < 1){
    errBox.innerHTML = errorHtml('لطفاً یک عدد معتبر برای محدودیت کاراکتر وارد کنید.');
    return;
  }
  const result = computeSegments(text, limit, endingType);
  if (result.error){
    errBox.innerHTML = errorHtml(result.error);
    return;
  }
  result.segments.forEach((seg, idx) => resultsBox.appendChild(makeCard(seg, idx, result.total, limit)));
}

function copyToClipboard(text, card){
  const hint = card.querySelector('.copy-hint');
  const old = hint.textContent;
  const done = () => {
    card.classList.add('copied');
    hint.textContent = 'کپی شد ✓';
    hint.style.opacity = 1;
    setTimeout(() => {
      card.classList.remove('copied');
      hint.textContent = old;
      hint.style.opacity = '';
    }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

/* ---------------- Manual mode ---------------- */
// Cuts are stored as character offsets, not word indexes, so after editing the text they are
// shifted to follow the words they belong to. A cut is dropped only if its spot was edited away.
function remapCuts(oldText, newText){
  if (!manualCuts.size) return;
  const oldLen = oldText.length, newLen = newText.length;
  const maxP = Math.min(oldLen, newLen);
  let p = 0;
  while (p < maxP && oldText[p] === newText[p]) p++;
  let s = 0;
  while (s < maxP - p && oldText[oldLen - 1 - s] === newText[newLen - 1 - s]) s++;
  const delta = newLen - oldLen;
  const inserted = newText.slice(p, newLen - s);
  const next = new Set();
  manualCuts.forEach(o => {
    if (o < p) next.add(o);
    else if (o >= oldLen - s) {
      if (o === p && /\s/.test(inserted)) next.add(o);   // whitespace typed right after the word
      else next.add(o + delta);                           // after (or at the end of) the edit
    }
    else if (o === p) next.add(o);
  });
  manualCuts.clear();
  next.forEach(o => manualCuts.add(o));
}

function renderManual(){
  const text = mainText.value;
  const limit = parseInt(limitInput.value || '0', 10);
  const endingType = endingSelect.value;
  const box = document.getElementById('manualBox');
  const errBox = document.getElementById('manualError');
  const resultsBox = document.getElementById('manualResults');
  box.innerHTML = ''; errBox.innerHTML = ''; resultsBox.innerHTML = '';

  const { words, seps } = tokenizeWords(text);
  if (!words.length){
    box.innerHTML = '<span class="placeholder">متنی برای نمایش وجود ندارد.</span>';
    return;
  }
  if (!limit || limit < 1) errBox.innerHTML = errorHtml('لطفاً یک عدد معتبر برای محدودیت کاراکتر وارد کنید.');

  // offset of the end of every word in the textarea, to map stored cuts back to word indexes
  const ends = [];
  let pos = text.length - text.replace(/^\s+/, '').length;
  words.forEach((w, i) => { pos += w.length; ends.push(pos); if (i < seps.length) pos += seps[i].length; });
  const cutSet = new Set();
  ends.forEach((o, i) => { if (i < words.length - 1 && manualCuts.has(o)) cutSet.add(i); });
  manualCuts.clear();
  cutSet.forEach(i => manualCuts.add(ends[i]));

  const cutList = Array.from(cutSet).sort((a,b) => a-b);
  const segStarts = [0, ...cutList.map(c => c+1)];
  const segEnds = [...cutList.map(c => c+1), words.length];
  const totalSegs = segStarts.length;

  // Effective limit of each segment (limit minus the ending that will be attached to it).
  const effs = segStarts.map((start, segIdx) => {
    if (!limit) return Infinity;
    const end = segEnds[segIdx];
    const segNumber = segIdx + 1;
    let e;
    if (segIdx === totalSegs - 1) {
      // Open trailing segment: reserve room for a possible future ending only if its raw text
      // already exceeds the limit.
      let rawLen = countChars(words[start]);
      for (let i = start + 1; i < end; i++) rawLen += countChars(seps[i-1]) + countChars(words[i]);
      e = (rawLen > limit) ? getPreviewEndingBudget(endingType, totalSegs, segNumber, true) : 0;
    } else {
      e = getEndingBudget(endingType, totalSegs, segNumber);
    }
    return limit - e;
  });

  let seg = 0, used = 0, over = false, zone = null;

  function makeSpan(text, cls, idx){
    const el = document.createElement('span');
    el.className = cls;
    el.textContent = text;
    if (cls.indexOf('gap') === 0){
      el.addEventListener('click', () => {
        const o = ends[idx];
        if (manualCuts.has(o)) manualCuts.delete(o); else manualCuts.add(o);
        renderManual();
      });
    }
    return el;
  }

  // Splits a piece of text exactly at the limit, even in the middle of a word. The split always
  // falls on a grapheme boundary, so a kasra (or any mark) stays attached to its letter. Everything
  // after the limit goes into ONE wrapper: a single continuous red band of uniform height.
  function emit(text, cls, idx){
    let inPart = '', overPart = '';
    for (const g of splitGraphemes(text)){
      const c = countChars(g);
      if (!over && used + c > effs[seg]) over = true;
      if (over) overPart += g; else { inPart += g; used += c; }
    }
    if (inPart) box.appendChild(makeSpan(inPart, cls, idx));
    if (overPart){
      if (!zone){ zone = document.createElement('span'); zone.className = 'over-zone'; box.appendChild(zone); }
      zone.appendChild(makeSpan(overPart, cls, idx));
    }
  }

  words.forEach((w, i) => {
    emit(w, 'word', i);
    if (i < words.length - 1){
      if (cutSet.has(i)){
        zone = null;
        box.appendChild(makeSpan(seps[i], 'gap cut', i));
        seg++; used = 0; over = false;
      } else {
        emit(seps[i], 'gap', i);
      }
    }
  });

  const finalSegs = segStarts.map((start, idx) => {
    const end = segEnds[idx];
    let segText = words[start];
    for (let i = start + 1; i < end; i++) segText += seps[i-1] + words[i];
    const ending = limit ? buildEnding(endingType, totalSegs, idx+1) : '';
    const full = combineSegment(segText, ending, endingType, totalSegs, idx+1);
    return { text: segText, full, length: countChars(full) };
  });
  finalSegs.forEach((seg, idx) => resultsBox.appendChild(makeCard(seg, idx, totalSegs, limit)));
}
